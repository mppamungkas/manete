<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" role="img" aria-label="NetLogger runs in two processes. In the main process, core modules read Android's telephony, location and device APIs and feed the logging engine in feature:logger, which writes one Room transaction per tick to netlogger.db; the screens read the database. The traffic capture runs in a separate :vpn process with a C capture loop and the zdtun forwarder, writes the pcap files itself and reports to the main process by broadcasts.">
<style>
.band { fill: #e8ece9; }
.frame { fill: none; stroke: #98a49e; stroke-width: 1.2; stroke-dasharray: 6 4; }
.frame.vpn { stroke: #a86a12; }
.frame-l { fill: #56635d; font: 600 12px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; letter-spacing: .04em; }
.frame-l.vpn { fill: #a86a12; }
.box { fill: #ffffff; stroke: #98a49e; stroke-width: 1; }
.box.hi { fill: #dcefe8; stroke: #0d7a63; stroke-width: 1.6; }
.box.vpn { fill: #f8ecd8; stroke: #a86a12; stroke-width: 1.2; }
.t { fill: #18221e; font: 600 13.5px "Source Sans 3", "Segoe UI", Roboto, sans-serif; }
.s { fill: #56635d; font: 11.5px "Source Sans 3", "Segoe UI", Roboto, sans-serif; }
.lbl { fill: #56635d; font: 11px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
.lbl.vpn { fill: #a86a12; }
.lbl.acc { fill: #0d7a63; }
.edge { fill: none; stroke: #56635d; stroke-width: 1.3; }
.edge.vpn { stroke: #a86a12; }
.edge.acc { stroke: #0d7a63; stroke-width: 1.6; }
.edge.dash { stroke-dasharray: 5 4; }
.ah { fill: #56635d; }
.ah.vpn { fill: #a86a12; }
.ah.acc { fill: #0d7a63; }
.thead { fill: #dcefe8; stroke: #0d7a63; stroke-width: 1.2; }
.tname { fill: #18221e; font: 700 13.5px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
.col { fill: #18221e; font: 11.5px "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
.col .k { fill: #0d7a63; font-weight: 600; }
.col .m { fill: #56635d; }
.card { fill: #ffffff; stroke: #98a49e; stroke-width: 1; }
</style>
<rect width="1180" height="850" fill="#ffffff"/>

          <defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="a1v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah vpn" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah acc" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <!-- Android APIs -->
          <rect class="band" x="20" y="14" width="1140" height="86" rx="4"/>
          <text class="frame-l" x="36" y="33">ANDROID · PUBLIC APIs ONLY</text>
          <rect class="box" x="40" y="42" width="200" height="46" rx="4"/>
          <text class="t" x="52" y="61">TelephonyManager</text>
          <text class="s" x="52" y="78">CellInfo · SignalStrength · DisplayInfo</text>
          <rect class="box" x="260" y="42" width="160" height="46" rx="4"/>
          <text class="t" x="272" y="61">Fused location</text>
          <text class="s" x="272" y="78">one stream, about 1 Hz</text>
          <rect class="box" x="440" y="42" width="180" height="46" rx="4"/>
          <text class="t" x="452" y="61">Battery · TrafficStats</text>
          <text class="s" x="452" y="78">thermal · screen state</text>
          <rect class="box" x="640" y="42" width="170" height="46" rx="4"/>
          <text class="t" x="652" y="61">ConnectivityManager</text>
          <text class="s" x="652" y="78">data route (Wi-Fi / mobile)</text>
          <rect class="box vpn" x="870" y="42" width="270" height="46" rx="4"/>
          <text class="t" x="882" y="61">VpnService (tun)</text>
          <text class="s" x="882" y="78">every app's IP packets, after the user's consent</text>

          <!-- Main process -->
          <rect class="frame" x="20" y="124" width="800" height="560" rx="6"/>
          <text class="frame-l" x="36" y="143">MAIN PROCESS</text>

          <rect class="box" x="40" y="160" width="240" height="56" rx="4"/>
          <text class="t" x="52" y="182">core:telephony</text>
          <text class="s" x="52" y="200">RadioSampler · CellParser · BandMapper</text>
          <rect class="box" x="300" y="160" width="150" height="56" rx="4"/>
          <text class="t" x="312" y="182">core:location</text>
          <text class="s" x="312" y="200">LocationProvider</text>
          <rect class="box" x="470" y="160" width="170" height="56" rx="4"/>
          <text class="t" x="482" y="182">core:device</text>
          <text class="s" x="482" y="200">device context · data route</text>
          <rect class="box" x="660" y="160" width="140" height="56" rx="4"/>
          <text class="t" x="672" y="182">core:diagnostics</text>
          <text class="s" x="672" y="200">used by every module</text>

          <rect class="box hi" x="40" y="262" width="400" height="64" rx="4"/>
          <text class="t" x="52" y="285">feature:logger · LoggingService (foreground)</text>
          <text class="s" x="52" y="303">LoggingEngine: one tick per interval · EventDetector</text>
          <text class="s" x="52" y="318">markers · floor plan taps · periodic speed test</text>
          <rect class="box" x="470" y="262" width="150" height="64" rx="4"/>
          <text class="t" x="482" y="285">feature:speedtest</text>
          <text class="s" x="482" y="303">OkHttp ping, download,</text>
          <text class="s" x="482" y="318">upload (mobile data)</text>
          <rect class="box" x="650" y="262" width="150" height="64" rx="4"/>
          <text class="t" x="662" y="285">feature:capture</text>
          <text class="s" x="662" y="303">CaptureController</text>
          <text class="s" x="662" y="318">CAPTURE_* events</text>

          <rect class="box" x="40" y="372" width="590" height="56" rx="4"/>
          <text class="t" x="52" y="394">core:data</text>
          <text class="s" x="52" y="412">Room database (schema v5) · repositories · settings · floor plan store and import</text>
          <rect class="box" x="650" y="372" width="150" height="56" rx="4"/>
          <text class="t" x="662" y="394">core:export</text>
          <text class="s" x="662" y="412">ZIP · CSV · heatmaps</text>

          <rect class="box" x="40" y="474" width="136" height="56" rx="4"/>
          <text class="t" x="52" y="496">Live</text>
          <text class="s" x="52" y="514">feature:logger</text>
          <rect class="box" x="196" y="474" width="136" height="56" rx="4"/>
          <text class="t" x="208" y="496">Sessions</text>
          <text class="s" x="208" y="514">feature:sessions</text>
          <rect class="box" x="352" y="474" width="136" height="56" rx="4"/>
          <text class="t" x="364" y="496">Settings</text>
          <text class="s" x="364" y="514">feature:settings</text>
          <rect class="box" x="508" y="474" width="136" height="56" rx="4"/>
          <text class="t" x="520" y="496">Floor plans</text>
          <text class="s" x="520" y="514">feature:indoor</text>
          <rect class="box" x="664" y="474" width="136" height="56" rx="4"/>
          <text class="t" x="676" y="496">Map</text>
          <text class="s" x="676" y="514">feature:map</text>

          <rect class="box" x="40" y="590" width="290" height="62" rx="4"/>
          <text class="t" x="52" y="612">:app</text>
          <text class="s" x="52" y="630">Hilt wiring · navigation · slots that pass</text>
          <text class="s" x="52" y="645">one feature's UI into another</text>
          <rect class="box" x="350" y="590" width="210" height="62" rx="4"/>
          <text class="t" x="362" y="612">core:model · core:ui</text>
          <text class="s" x="362" y="630">pure models and maths ·</text>
          <text class="s" x="362" y="645">theme, colours, PlanView</text>

          <!-- :vpn process -->
          <rect class="frame vpn" x="850" y="124" width="310" height="300" rx="6"/>
          <text class="frame-l vpn" x="866" y="143">:VPN PROCESS (CRASH-ISOLATED)</text>
          <rect class="box vpn" x="870" y="160" width="270" height="52" rx="4"/>
          <text class="t" x="882" y="181">NativeCaptureService</text>
          <text class="s" x="882" y="199">foreground · one capture per session</text>
          <rect class="box vpn" x="870" y="232" width="270" height="52" rx="4"/>
          <text class="t" x="882" y="253">libnetcapture (C, NDK)</text>
          <text class="s" x="882" y="271">select() loop · pcap writer, ns timestamps</text>
          <rect class="box vpn" x="870" y="304" width="270" height="52" rx="4"/>
          <text class="t" x="882" y="325">zdtun</text>
          <text class="s" x="882" y="343">user-space TCP / UDP forwarder</text>

          <!-- Internet -->
          <rect class="frame" x="850" y="448" width="310" height="236" rx="6"/>
          <text class="frame-l" x="866" y="467">INTERNET</text>
          <rect class="box" x="870" y="484" width="210" height="40" rx="4"/>
          <text class="t" x="882" y="509">Speed test server · Cloudflare</text>
          <rect class="box" x="870" y="540" width="210" height="40" rx="4"/>
          <text class="t" x="882" y="565">OpenStreetMap tiles</text>
          <rect class="box" x="870" y="596" width="210" height="40" rx="4"/>
          <text class="t" x="882" y="621">Servers of the apps</text>

          <!-- Storage -->
          <rect class="band" x="20" y="708" width="1140" height="132" rx="4"/>
          <text class="frame-l" x="36" y="727">ON THE PHONE · APP-PRIVATE STORAGE</text>
          <rect class="box hi" x="40" y="744" width="240" height="72" rx="4"/>
          <text class="t" x="52" y="767">netlogger.db</text>
          <text class="s" x="52" y="785">sessions · ticks · cells · events</text>
          <text class="s" x="52" y="800">speed tests · floor plans · taps</text>
          <rect class="box" x="300" y="744" width="240" height="72" rx="4"/>
          <text class="t" x="312" y="767">files/captures/</text>
          <text class="s" x="312" y="785">&lt;uuid&gt;.pcap · _sync.csv</text>
          <text class="s" x="312" y="800">_connections.csv</text>
          <rect class="box" x="560" y="744" width="200" height="72" rx="4"/>
          <text class="t" x="572" y="767">files/plans/</text>
          <text class="s" x="572" y="785">&lt;uuid&gt;.png, at most 4096 px</text>
          <rect class="box" x="780" y="744" width="180" height="72" rx="4"/>
          <text class="t" x="792" y="767">files/problems/</text>
          <text class="s" x="792" y="785">problem reports</text>
          <text class="s" x="792" y="800">caught errors (7 days)</text>

          <!-- Edges: Android → core -->
          <line class="edge" x1="140" y1="88" x2="140" y2="158" marker-end="url(#a1)"/>
          <text class="lbl" x="148" y="134">callbacks, requests</text>
          <line class="edge" x1="360" y1="88" x2="360" y2="158" marker-end="url(#a1)"/>
          <text class="lbl" x="368" y="134">fixes</text>
          <line class="edge" x1="540" y1="88" x2="540" y2="158" marker-end="url(#a1)"/>
          <text class="lbl" x="548" y="134">readings</text>
          <line class="edge" x1="700" y1="88" x2="625" y2="158" marker-end="url(#a1)"/>
          <text class="lbl" x="672" y="134">route</text>

          <!-- core → engine -->
          <line class="edge acc" x1="160" y1="216" x2="160" y2="260" marker-end="url(#a1a)"/>
          <text class="lbl acc" x="168" y="244">RadioSnapshot</text>
          <line class="edge acc" x1="375" y1="216" x2="375" y2="260" marker-end="url(#a1a)"/>
          <text class="lbl acc" x="383" y="244">fix</text>
          <line class="edge acc" x1="520" y1="216" x2="436" y2="260" marker-end="url(#a1a)"/>
          <text class="lbl acc" x="486" y="244">context</text>
          <line class="edge" x1="440" y1="294" x2="468" y2="294" marker-end="url(#a1)"/>
          <text class="lbl" x="443" y="286">run</text>

          <!-- engine → database -->
          <line class="edge acc" x1="240" y1="326" x2="240" y2="370" marker-end="url(#a1a)"/>
          <text class="lbl acc" x="248" y="354">1 transaction per tick</text>

          <!-- database → screens -->
          <line class="edge" x1="108" y1="428" x2="108" y2="472" marker-end="url(#a1)"/>
          <text class="lbl" x="116" y="456">observe</text>
          <line class="edge" x1="264" y1="428" x2="264" y2="472" marker-end="url(#a1)"/>
          <text class="lbl" x="272" y="456">read, export</text>

          <!-- Room → database file -->
          <path class="edge" d="M40,400 L30,400 L30,780 L38,780" marker-end="url(#a1)"/>

          <!-- Floor plans → files/plans -->
          <line class="edge" x1="576" y1="530" x2="576" y2="742" marker-end="url(#a1)"/>
          <text class="lbl" x="584" y="566">plan images</text>

          <!-- speed test → server -->
          <path class="edge" d="M545,326 L545,348 L843,348 L843,504 L868,504" marker-end="url(#a1)"/>
          <text class="lbl" x="640" y="342">HTTP over mobile data</text>

          <!-- Map → tiles -->
          <path class="edge" d="M800,502 L835,502 L835,560 L868,560" marker-end="url(#a1)"/>

          <!-- capture controller ⇄ :vpn service -->
          <path class="edge vpn" d="M802,294 L835,294 L835,186 L868,186" marker-start="url(#a1v)" marker-end="url(#a1v)"/>
          <text class="lbl vpn" x="664" y="238">intents ⇄</text>
          <text class="lbl vpn" x="664" y="251">broadcasts 1 s</text>

          <!-- tun ⇄ service -->
          <line class="edge vpn" x1="1005" y1="90" x2="1005" y2="158" marker-start="url(#a1v)" marker-end="url(#a1v)"/>
          <text class="lbl vpn" x="1013" y="134">tun fd</text>

          <!-- zdtun ⇄ app servers -->
          <path class="edge vpn" d="M1120,356 L1120,616 L1082,616" marker-start="url(#a1v)" marker-end="url(#a1v)"/>
          <text class="lbl vpn" x="1114" y="440" text-anchor="end">protected sockets</text>

          <!-- pcap → files/captures -->
          <path class="edge vpn" d="M1140,258 L1168,258 L1168,830 L420,830 L420,818" marker-end="url(#a1v)"/>
          <text class="lbl vpn" x="1160" y="824" text-anchor="end">writes pcap</text>
        </svg>
